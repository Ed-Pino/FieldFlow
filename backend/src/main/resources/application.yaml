spring:
  application:
    name: backend
  datasource:
    # Desarrollo local con H2 (archivo persistente en ./data/fieldflow.mv.db)
    url: jdbc:h2:file:./data/fieldflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    # Postgres (producción / más adelante):
    # url: jdbc:postgresql://localhost:5432/fieldflow
    # username: postgres
    # password: postgres
    # driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: Y2hhbmdlTWVUbG9uZ1NlY3JldEtleUZvckZpZWxkRmxvd1Byb2plY3QyMDI2SGV4YVN0cmluZw==
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO